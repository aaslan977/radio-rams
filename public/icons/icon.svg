<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Решётка динамика, сведённая к минимуму: гексагональная упаковка отверстий
       (центр + шесть вокруг) на поле акцентного цвета. Единственная деталь, по
       которой прибор опознаётся с одного взгляда; семь крупных точек переживают
       уменьшение до 32px, где любая мелкая графика умирает. -->
  <circle cx="256" cy="256" r="256" fill="#ff611a"/>
  <g fill="#1c1c1c">
    <circle cx="256" cy="256" r="42"/>
    <circle cx="256" cy="146" r="42"/>
    <circle cx="351.3" cy="201" r="42"/>
    <circle cx="351.3" cy="311" r="42"/>
    <circle cx="256" cy="366" r="42"/>
    <circle cx="160.7" cy="311" r="42"/>
    <circle cx="160.7" cy="201" r="42"/>
  </g>
</svg>
