<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <!-- iOS при «Добавить на экран» не читает манифест и не поддерживает там
         SVG — без этого тега иконкой приложения становится скриншот страницы. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <!-- viewport-fit=cover — без него iOS сам резервирует безопасную зону под
         вырезом/home-indicator и в неё просвечивает фон body, а не корпус
         устройства; отступы под вырез расставляет DeviceShell через env(). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f7" />
    <meta name="description" content="Веб-радиоприёмник в эстетике Braun с живым эквалайзером" />
    <!-- У каждого превью-деплоя на Vercel свой поддомен: без canonical поисковик
         может проиндексировать их как дубликаты основного адреса. -->
    <link rel="canonical" href="https://radio-rams.vercel.app/" />

    <!-- Open Graph. URL абсолютные: краулеры Telegram, Slack и прочих забирают
         og:image отдельным запросом и относительный путь не резолвят. Размеры
         указаны явно — без них превью в части клиентов рисуется маленькой
         карточкой вместо крупной. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="radio rams" />
    <meta property="og:url" content="https://radio-rams.vercel.app/" />
    <meta property="og:title" content="radio rams" />
    <meta property="og:description" content="Веб-радиоприёмник в эстетике Braun с живым эквалайзером" />
    <meta property="og:image" content="https://radio-rams.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="radio rams" />
    <meta property="og:locale" content="ru_RU" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="radio rams" />
    <meta name="twitter:description" content="Веб-радиоприёмник в эстетике Braun с живым эквалайзером" />
    <meta name="twitter:image" content="https://radio-rams.vercel.app/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Заголовок длиннее имени бренда намеренно: это ещё и строка в поисковой
         выдаче, где голое «radio rams» ничего не объясняет. В og:title, наоборот,
         дескриптор не нужен — там над ним стоит картинка с тем же словом, а под
         ним описание. -->
    <title>radio rams — веб-радиоприёмник в эстетике Braun</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
